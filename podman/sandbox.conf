# Per-kit sandbox profile applied by connect-sandboxed.sh.
#   <kit> = <space-separated flags>
# Flags:
#   gui           default answer for the GUI prompt (you can still override it)
#   x11           XWayland (only takes effect when GUI is on) - e.g. Android Studio
#   kvm           /dev/kvm passthrough (only applied if present on the host)
#   host-network  share the host network
#   host-dbus     share the host session D-Bus
#
# A ~/.config/ai-dev/sandbox.conf (or $SANDBOX_CONF) overrides these per kit.

base    = gui
dev     = gui
java    = gui x11
android = gui x11 kvm
node    = gui x11
